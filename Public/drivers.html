<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Management</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="container">

    <h1>👨‍✈️ Driver Management</h1>

    <form id="driverForm">

        <input
            type="text"
            id="driverName"
            placeholder="Driver Name"
            required
        >

        <input
            type="text"
            id="phone"
            placeholder="Phone Number"
            required
        >

        <input
            type="text"
            id="licenseNumber"
            placeholder="License Number"
            required
        >

        <input
            type="text"
            id="assignedBus"
            placeholder="Assigned Bus"
            required
        >

        <button type="submit">
            Save Driver
        </button>

    </form>

    <br>

    <table border="1" width="100%">

        <thead>

            <tr>

                <th>Name</th>
                <th>Phone</th>
                <th>License</th>
                <th>Assigned Bus</th>
                <th>Status</th>
                <th>Action</th>

            </tr>

        </thead>

        <tbody id="driverTableBody">

        </tbody>

    </table>

</div>

<script src="/script.js"></script>

</body>

</html>
