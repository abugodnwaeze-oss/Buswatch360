<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Driver Management</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<div class="admin-container">

    <div class="sidebar">

        <h2>🚌 BusWatch360</h2>

        <ul>

            <li><a href="/admin">🏠 Dashboard</a></li>

            <li><a href="/students">👨 Students</a></li>

            <li><a href="/buses">🚌 Buses</a></li>

            <li><a href="/drivers">👨‍✈️ Drivers</a></li>

            <li><a href="/trip-centre">🚍 Trip Centre</a></li>

            <li><a href="#">📊 Reports</a></li>

        </ul>

    </div>

    <div class="main-content">

        <h1>👨‍✈️ Driver Management</h1>

        <form id="driverForm">

            <input
                type="text"
                id="driverName"
                placeholder="Driver Name"
                required
            >

            <input
                type="text"
                id="phone"
                placeholder="Phone Number"
                required
            >

            <input
                type="text"
                id="licenseNumber"
                placeholder="License Number"
                required
            >

            <select id="assignedBus" required>

                <option value="">
                    Select Bus
                </option>

            </select>

            <button type="submit">

                Save Driver

            </button>

        </form>

        <br>

        <table class="student-table">

            <thead>

                <tr>

                    <th>Driver</th>

                    <th>Phone</th>

                    <th>License</th>

                    <th>Assigned Bus</th>

                    <th>Status</th>

                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="driverTableBody">

            </tbody>

        </table>

    </div>

</div>

<script src="/script.js"></script>

</body>

</html>
