<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bus Management</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<div class="admin-container">

    <div class="sidebar">

        <h2>🚌 BusWatch360</h2>

        <ul>

            <li><a href="/admin">🏠 Dashboard</a></li>

            <li><a href="/students">👨 Students</a></li>

            <li><a href="/buses">🚌 Buses</a></li>

            <li><a href="/drivers">👨‍✈️ Drivers</a></li>

            <li><a href="/trip-centre">🚍 Trip Centre</a></li>

            <li><a href="#">📊 Reports</a></li>

        </ul>

    </div>

    <div class="main-content">

        <h1>🚌 Bus Management</h1>

        <form id="busForm">

            <input
                type="text"
                id="busName"
                placeholder="Bus Name"
                required
            >

            <input
                type="text"
                id="plateNumber"
                placeholder="Plate Number"
                required
            >

            <input
                type="number"
                id="capacity"
                placeholder="Capacity"
                required
            >

            <select id="driver" required>

                <option value="">
                    Select Driver
                </option>

            </select>

            <button type="submit">

                Save Bus

            </button>

        </form>

        <br>

        <table class="student-table">

            <thead>

                <tr>

                    <th>Bus</th>
                    <th>Plate Number</th>
                    <th>Capacity</th>
                    <th>Driver</th>
                    <th>Status</th>
                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="busTableBody">

            </tbody>

        </table>

    </div>

</div>

<script src="/script.js"></script>

</body>

</html>
