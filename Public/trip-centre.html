<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Centre - BusWatch360</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="admin-container">

    <div class="sidebar">

        <h2>🚌 BusWatch360</h2>

        <ul>
            <li><a href="/admin">🏠 Dashboard</a></li>
            <li><a href="/students">👨 Students</a></li>
            <li><a href="/buses">🚌 Buses</a></li>
            <li><a href="/drivers">👨‍✈️ Drivers</a></li>
            <li><a href="/trip-centre">🚍 Trip Centre</a></li>
            <li><a href="/reports">📊 Reports</a></li>
        </ul>

    </div>

    <div class="main-content">

        <h1>🚍 Trip Centre</h1>

        <h3>Select Bus</h3>

        <select id="tripBus" required>

            <option value="">
                Select Bus
            </option>

        </select>

        <br><br>

       <div class="trip-summary">

    <div class="summary-card">

        <h3>Assigned</h3>

        <h2 id="assignedCount">0</h2>

    </div>

    <div class="summary-card">

        <h3>Boarded</h3>

        <h2 id="boardedCount">0</h2>

    </div>

   <div id="departureStatus" class="departure-status not-ready">
    🔴 NOT READY TO DEPART
</div>

<div class="missing-panel">

    <h3>⚠ Missing Students</h3>

    <ul id="missingStudents">

    </ul>

</div>

<br>
        <h3>Waiting</h3>

        <h2 id="waitingCount">0</h2>

    </div>

</div>

<br>

        <table class="student-table">

            <thead>

                <tr>

                    <th>Student</th>
                    <th>Class</th>
                    <th>Status</th>
                    <th>Board</th>

                </tr>

            </thead>

            <tbody id="tripStudentTable">

            </tbody>

        </table>

    </div>

</div>

<script src="/script.js"></script>

</body>
</html>
